name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Calidad y dependencias
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      COMPOSE_PROJECT_NAME: meli-ci
      DB_LOCAL_PORT: "55432"
      DB_PORT: "55432"
    steps:
      - name: Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Instalar dependencias desde el lockfile
        run: npm ci --ignore-scripts

      - name: Verificar tipos
        run: npm run typecheck

      - name: Ejecutar tests
        run: npm test

      - name: Compilar
        run: npm run build

      - name: Auditar dependencias de ejecución y desarrollo
        run: npm audit --audit-level=high

      - name: Preparar PostgreSQL de pruebas
        run: npm run db:up

      - name: Aplicar migraciones y comprobar reejecución
        run: |
          npm run db:migrate
          npm run db:migrate

      - name: Verificar permisos y restricciones PostgreSQL
        run: npm run db:test

      - name: Verificar conexión Node a PostgreSQL
        run: npm run db:test:node

      - name: Eliminar la base temporal de CI
        if: always()
        run: docker compose down --volumes

  secrets:
    name: Secretos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obtener código e historial completo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar Gitleaks y verificar SHA256
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${RUNNER_TEMP}/gitleaks.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "${RUNNER_TEMP}/gitleaks.tar.gz" --directory "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Buscar secretos en el historial disponible
        run: gitleaks git --log-opts=--all --redact=100 --no-banner --exit-code=1 .

  sast:
    name: SAST
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Analizar TypeScript, Node y workflows
        env:
          SEMGREP_IMAGE: semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/src:ro"
          --workdir /src
          "$SEMGREP_IMAGE"
          semgrep scan
          --config p/javascript
          --config p/nodejs
          --config p/github-actions
          --metrics=off
          --disable-version-check
          --error
          --strict
          src test .github/workflows
